[package]
name = "lazy-transfer"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "A TUI dual-pane file manager for remote file transfers over SSH/SCP, SFTP, FTP and WebDAV"
license = "MIT"
readme = "README.md"
keywords = ["sftp", "webdav", "tui", "terminal", "file-transfer"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
log = "0.4"
dirs = "6"
which = "7"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
fuzzy-matcher = "0.3"
chrono = "0.4"
base64 = "0.22"
ssh2 = "0.9"
suppaftp = "6"
ureq = { version = "3", default-features = false, features = ["rustls"] }
roxmltree = "0.20"
url = "2"
percent-encoding = "2"
md-5 = "0.11"

[features]
vendored-openssl = ["ssh2/vendored-openssl"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
